<div class="portal-wrap">
  <div class="portal-card estreito">
    <div class="poles" aria-hidden="true"><span class="pole"></span><span class="pole"></span></div>
    <h1>Criar conta</h1>
    <p class="sub">Agende seu horário online</p>

    <div class="alerta" *ngIf="erro()">{{ erro() }}</div>

    <div class="campo">
      <label>Nome completo</label>
      <input type="text" [(ngModel)]="form.nome" placeholder="seu nome" />
    </div>
    <div class="campo">
      <label>Telefone</label>
      <input type="tel" [(ngModel)]="form.telefone" placeholder="(00) 00000-0000" />
    </div>
    <div class="campo">
      <label>E-mail (opcional)</label>
      <input type="email" [(ngModel)]="form.email" placeholder="seu@email.com" />
    </div>
    <div class="campo">
      <label>Usuário</label>
      <input type="text" [(ngModel)]="form.usuario" autocomplete="username" placeholder="escolha um usuário" />
    </div>
    <div class="campo">
      <label>Senha</label>
      <input type="password" [(ngModel)]="form.senha" autocomplete="new-password" placeholder="mínimo 6 caracteres" />
    </div>
    <div class="campo">
      <label>Confirmar senha</label>
      <input type="password" [(ngModel)]="form.confirmar" autocomplete="new-password"
             (keyup.enter)="cadastrar()" placeholder="repita a senha" />
    </div>

    <button class="btn-entrar" (click)="cadastrar()" [disabled]="carregando()">
      {{ carregando() ? 'Criando…' : 'Criar conta' }}
    </button>

    <p class="dica">Já tem conta? <a routerLink="/login-cliente">Entrar</a></p>
  </div>
</div>
