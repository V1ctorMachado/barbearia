<div class="login-wrap">
  <div class="login-card">
    <div class="poles" aria-hidden="true">
      <span class="pole"></span>
      <span class="pole"></span>
    </div>

    <h1>Navalha & Cia</h1>
    <p class="sub">Acesso ao sistema</p>

    <div class="alerta" *ngIf="erro()">{{ erro() }}</div>

    <div class="campo">
      <label for="user">Usuário</label>
      <input id="user" type="text" [(ngModel)]="usuario" autocomplete="username"
             (keyup.enter)="entrar()" placeholder="seu usuário" />
    </div>

    <div class="campo">
      <label for="pass">Senha</label>
      <input id="pass" type="password" [(ngModel)]="senha" autocomplete="current-password"
             (keyup.enter)="entrar()" placeholder="sua senha" />
    </div>

    <button class="btn-entrar" (click)="entrar()" [disabled]="carregando()">
      {{ carregando() ? 'Entrando…' : 'Entrar' }}
    </button>

    <p class="dica">Primeiro acesso: <strong>admin</strong> / <strong>admin123</strong></p>
  </div>
</div>
