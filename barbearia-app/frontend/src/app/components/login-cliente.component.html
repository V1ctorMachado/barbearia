<div class="portal-wrap">
  <div class="portal-card estreito">
    <div class="poles" aria-hidden="true"><span class="pole"></span><span class="pole"></span></div>
    <h1>Navalha & Cia</h1>
    <p class="sub">Área do cliente</p>

    <div class="alerta" *ngIf="erro()">{{ erro() }}</div>

    <div class="campo">
      <label>Usuário</label>
      <input type="text" [(ngModel)]="usuario" autocomplete="username"
             (keyup.enter)="entrar()" placeholder="seu usuário" />
    </div>
    <div class="campo">
      <label>Senha</label>
      <input type="password" [(ngModel)]="senha" autocomplete="current-password"
             (keyup.enter)="entrar()" placeholder="sua senha" />
    </div>

    <button class="btn-entrar" (click)="entrar()" [disabled]="carregando()">
      {{ carregando() ? 'Entrando…' : 'Entrar' }}
    </button>

    <p class="dica">Não tem conta? <a routerLink="/cadastro">Criar conta</a></p>
  </div>
</div>
