<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1512" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Barbearia Mageschi — Agendamentos</title>
    <!-- Ícones: poste de barbeiro na aba (lê bem em tamanho pequeno);
         emblema completo na tela inicial do celular. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" id="manifest" href="/site.webmanifest" />
    <!-- Telas da equipe: atalho na tela inicial abre em /staff (e não em /) -->
    <script>
      if (/^\/(staff|painel|faturamento|configuracoes)/.test(location.pathname)) {
        document.getElementById('manifest').href = '/staff.webmanifest';
        document.title = 'Mageschi Equipe';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
